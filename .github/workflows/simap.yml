name: Marchés publics simap (collecte)
on:
  workflow_dispatch:
    inputs:
      periodes:
        description: "Périodes AAAA-MM-JJ:AAAA-MM-JJ séparées par des espaces (une tâche par période). Vide = hier seulement."
        required: false
        default: ""
      pause:
        description: "Secondes entre deux requêtes d'une même tâche (5 tâches en parallèle au plus)"
        required: false
        default: "0.8"
permissions:
  contents: write
concurrency:
  group: simap
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      p: ${{ steps.p.outputs.p }}
    steps:
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt
          s = """${{ inputs.periodes }}""".split()
          if not s:
              h = (dt.date.today() - dt.timedelta(days=1)).isoformat()
              s = [h + ":" + h]
          print("p=" + json.dumps(s))
          PY
  collecte:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        periode: ${{ fromJson(needs.plan.outputs.p) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests lxml cryptography
      - run: python3 simap.py periode "${{ matrix.periode }}" --pause "${{ inputs.pause || '0.8' }}"
      - name: Publier
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view simap >/dev/null 2>&1 || gh release create simap --title simap --notes "Marchés publics simap.ch, fichiers chiffrés (voir README)." || true
          gh release upload simap out/* --clobber
