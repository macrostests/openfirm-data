name: Marchés publics simap (7 h 30, publications du jour)
# Lancé par le cron du Worker à 7 h 30 (heure de Zurich), seulement si l'interrupteur MARCHES du Worker est allumé.
# Les publications du jour sont rangées dans D1 ; le Worker ne les montre qu'à partir de 8 h 00 (CG de l'API simap).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: simap
  cancel-in-progress: false
jobs:
  matin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests lxml cryptography
      - name: Collecte simap du jour
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          j=$(TZ=Europe/Zurich date +%F)
          python3 simap.py jour "$j" --pause 0.8
          gh release upload simap out/* --clobber
      - name: Code du site
        uses: actions/checkout@v4
        with:
          repository: macrostests/openfirm
          token: ${{ secrets.OPENFIRM_CODE }}
          path: site
      - name: Rattachement et chargement D1
        working-directory: site
        env:
          OPENFIRM_DATA_KEY: ${{ secrets.OPENFIRM_DATA_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ff81216e3bb191aa13a379e2f9244ab1
        run: |
          pip install cryptography >/dev/null
          mkdir -p keys dist/_marches && umask 077 && printf '%s\n' "$OPENFIRM_DATA_KEY" > keys/openfirm-data.pem
          npx --yes wrangler@4 r2 object get openfirm-site/_state/marches-index.json.gz --file dist/_marches/index.json.gz --remote
          python tools/marches_nuit.py --matin dist/_marches/index.json.gz
          rm -f keys/openfirm-data.pem
          if [ -s dist/_marches/matin.sql ]; then
            cd hosting/worker && npx --yes wrangler@4 d1 execute openfirm-recherche --remote --file ../../dist/_marches/matin.sql --yes
          fi
