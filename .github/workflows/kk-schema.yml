name: Diagnostic faillites de personnes (structure seulement, sans nom)
on:
  workflow_dispatch:
    inputs:
      jours: { description: "jours AAAA-MM-JJ séparés par des espaces", default: "2026-11-17 2026-11-18 2026-11-19" }
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests lxml cryptography
      - run: python3 kk_schema.py ${{ inputs.jours }}
