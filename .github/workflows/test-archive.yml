name: Test des archives FOSC (lecture seule)
# Vérifie les règles robots.txt et repère les liens d'archive (numéros quotidiens 2002-2018). Aucune donnée gardée.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: robots.txt
        run: |
          UA="OpenFirm-archive-test/1.0 (contact@openfirm.ch)"
          for h in www.zefix.ch amtsblattportal.ch lindas.admin.ch ld.admin.ch; do
            echo "=== $h"; curl -s -A "$UA" --max-time 20 "https://$h/robots.txt" | head -40; echo
          done
